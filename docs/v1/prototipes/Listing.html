<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-station — proto 11</title>
<style>
  /* Tokens: the shared prototype standard (see README.md) — semantic, one place, theme.ts mirrors it. */
  :root {
    --bg: #16161e;          /* terminal background behind the panel */
    --surface: #1a1b26;     /* panel background */
    --border: #3b4261;
    --separator: #282c3f;   /* faint line between rows */
    --text: #c0caf5;
    --muted: #565f89;
    --attention: #e0af68;   /* keys, dirty/ahead/behind, search query */
    --warning: #f7768e;     /* destructive actions */
    --selection: #2f334d;   /* selected-row background */
    --font: "JetBrains Mono", "Fira Code", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* The prototype terminal: a fixed-size canvas like the real app would fill */
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 var(--font);
    display: grid;
    place-items: center;
    padding: 2rem;
  }
  .term {
    width: 80rem;
    max-width: 100%;
    height: min(42rem, calc(100vh - 4rem));
    position: relative;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Centered panel, sharp corners; nothing written on the border line */
  .panel {
    position: relative;
    width: min(110ch, 92%);
    height: min(36rem, 94%);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0 0 0.7rem;
    display: flex;
    flex-direction: column;
  }

  /* Search band: idle shows the placeholder only; with an active search it
     shows the query on the left and the "clear: esc" hint on the right.
     The hints line at the bottom is gone — the band is the status line. */
  .band {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 0.55rem 2rem;
    border-bottom: 1px solid var(--border);
  }
  .band .query {
    color: var(--attention);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .band .clear-hint { color: var(--muted); white-space: nowrap; }
  .band .clear-hint kbd { color: var(--attention); }
  .band input {
    background: none;
    border: none;
    outline: none;
    color: var(--attention);
    font: inherit;
    caret-color: var(--attention);
    padding: 0;
    text-align: left;
    width: 100%;
  }
  .band input::placeholder { color: var(--muted); }

  .attention { color: var(--attention); }

  /* Table: id | repo/branch | dirty/ahead/behind (one column, on the right) */
  .thead, .row {
    display: grid;
    grid-template-columns: 5ch 1fr 22ch;
    column-gap: 1rem;
    padding: 0 2rem;
    align-items: baseline;
    text-align: center;
  }
  .thead { color: var(--muted); padding-top: 0.5rem; padding-bottom: 0.3rem; white-space: nowrap; }
  .list {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 0.4rem;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .row {
    padding-top: 0.55rem;
    padding-bottom: 0.55rem;
    border-bottom: 1px solid var(--separator);
  }
  .row:last-child { border-bottom: none; }
  .row.selected { background: var(--selection); }
  .idx { color: var(--muted); }
  .repo .name { color: var(--text); }
  .repo .branch { color: var(--muted); }
  .sync { color: var(--attention); }
  .sync .sep, .sync .none { color: var(--muted); }
  .dim { color: var(--muted); }

  .empty { padding: 1rem 2rem; color: var(--muted); text-align: center; }

  /* Hints: one line spanning the full panel width, "action: key" */
  .hints {
    display: flex;
    justify-content: space-between;
    padding: 0.6rem 2rem 0;
    border-top: 1px solid var(--border);
    color: var(--muted);
  }
  kbd {
    font: inherit;
    color: var(--attention);
    background: none;
    border: none;
    padding: 0;
  }

  .proto-tag {
    position: fixed;
    bottom: 10px;
    right: 14px;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="term">
  <main class="panel">
    <div class="band">
      <input id="q" placeholder="search" spellcheck="false" autocomplete="off">
      <span class="clear-hint" id="clearHint" hidden>cancel: <kbd>esc</kbd></span>
    </div>

    <div class="thead">
      <span>#</span><span>repo / branch</span><span>dirty / ahead / behind</span>
    </div>

    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden></div>

    <div class="hints">
      <span>move: <kbd>&uarr;&darr;</kbd></span>
      <span>open: <kbd>enter</kbd></span>
      <span>search: <kbd>?</kbd></span>
      <span>quit: <kbd>q</kbd></span>
    </div>
  </main>
  </div>

  <span class="proto-tag">proto 11</span>

<script>
  // Fake data shaped like the real RowView: name, branch, dirty, ahead, behind (or null).
  // Mocked with variety: every sync-column state appears at least once.
  const data = [
    { name: "detached-demo",            branch: "detached",                 dirty: false, ahead: null, behind: null },
    { name: "rename-demo",              branch: "main",                     dirty: true,  ahead: null, behind: null },
    { name: "vivarium",                 branch: "main",                     dirty: true,  ahead: null, behind: null },
    { name: "career-hub",               branch: "main",                     dirty: false, ahead: null, behind: 1 },
    { name: "open-design",              branch: "main",                     dirty: true,  ahead: null, behind: 1 },
    { name: "git-station",              branch: "main",                     dirty: false, ahead: 1,    behind: null },
    { name: "theme-night-city",         branch: "feature/delta-night-city", dirty: true,  ahead: 2,    behind: 1 },
    { name: "templates",                branch: "main",                     dirty: false, ahead: 5,    behind: null },
    { name: "tetris",                   branch: "master",                   dirty: false, ahead: null, behind: null },
    { name: "college",                  branch: "main",                     dirty: true,  ahead: null, behind: 3 },
    { name: "opencode-voice-dictation", branch: "main",                     dirty: false, ahead: null, behind: null },
    { name: "notebooklm-gallery",       branch: "main",                     dirty: false, ahead: null, behind: null },
    { name: "jobspy-mcp-server",        branch: "main",                     dirty: true,  ahead: null, behind: null },
    { name: "portfolio",                branch: "main",                     dirty: false, ahead: null, behind: null },
    { name: "memories",                 branch: "main",                     dirty: false, ahead: null, behind: null },
    { name: "pair-programming",         branch: "main",                     dirty: false, ahead: null, behind: null },
    { name: "exercism",                 branch: "main",                     dirty: true,  ahead: 1,    behind: null },
    { name: "challenges",               branch: "main",                     dirty: false, ahead: null, behind: null },
    { name: "code-road",                branch: "master",                   dirty: false, ahead: null, behind: null },
    { name: "kata-machine",             branch: "main",                     dirty: false, ahead: null, behind: null },
    { name: "node-lab",                 branch: "main",                     dirty: false, ahead: null, behind: null },
    { name: "i-have-adhd",              branch: "main",                     dirty: true,  ahead: null, behind: 1 },
    { name: "vivarium-ui",              branch: "main",                     dirty: false, ahead: null, behind: null },
    { name: "vivarium-core",            branch: "main",                     dirty: false, ahead: null, behind: null },
    { name: "pi-messages",              branch: "main",                     dirty: true,  ahead: null, behind: 2 },
  ];

  const list = document.getElementById("list");
  const input = document.getElementById("q");
  const empty = document.getElementById("empty");
  let visible = data;
  let selected = 0;
  const rowNodes = [];

  function render() {
    list.textContent = "";
    rowNodes.length = 0;
    visible.forEach((r, i) => {
      const row = document.createElement("div");
      row.className = "row";

      const idx = document.createElement("span");
      idx.className = "idx";
      idx.textContent = String(data.indexOf(r) + 1).padStart(2, "0");

      const repo = document.createElement("span");
      repo.className = "repo";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = r.name;
      const branch = document.createElement("span");
      branch.className = "branch";
      branch.textContent = " / " + r.branch;
      repo.append(name, branch);

      // One sync column on the right: "✱ / ↑1 / ↓2" — dirty, ahead, behind.
      // A segment with no value shows a dash when others have one;
      // the whole cell stays empty when the repository is fully idle.
      const sync = document.createElement("span");
      const hasDirty = r.dirty, hasAhead = !!r.ahead, hasBehind = !!r.behind;
      const any = hasDirty || hasAhead || hasBehind;
      if (!any) {
        sync.textContent = "";
      } else {
        sync.className = "sync";
        const segs = [];
        const mk = (value, none) => {
          const s = document.createElement("span");
          if (none) { s.className = "none"; s.textContent = "—"; }
          else s.textContent = value;
          segs.push(s);
        };
        if (hasDirty) mk("✱", false); else mk("", true);
        if (hasAhead) mk("↑" + r.ahead, false); else mk("", true);
        if (hasBehind) mk("↓" + r.behind, false); else mk("", true);
        segs.forEach((s, i) => {
          if (i > 0) {
            const sep = document.createElement("span");
            sep.className = "sep";
            sep.textContent = " / ";
            sync.append(sep);
          }
          sync.append(s);
        });
      }

      row.append(idx, repo, sync);
      rowNodes.push(row);
      list.append(row);
    });
    updateSelection();
  }

  function updateSelection() {
    if (selected >= visible.length) selected = visible.length - 1;
    if (selected < 0) selected = 0;
    rowNodes.forEach((n, i) => n.classList.toggle("selected", i === selected));
    const row = rowNodes[selected];
    if (row) row.scrollIntoView({ block: "nearest" });
  }

  function move(delta) {
    // Circular navigation: one past the end wraps to the first row and back.
    const n = visible.length;
    if (n === 0) return;
    selected = ((selected + delta) % n + n) % n;
    updateSelection();
  }

  function filter(q) {
    q = q.trim().toLowerCase();
    visible = q ? data.filter(r => r.name.toLowerCase().includes(q)) : data;
    selected = 0;
    render();
    updateHint(q);
    const none = q && visible.length === 0;
    empty.hidden = !none;
    if (none) empty.textContent = 'No repository matches "' + q + '"';
  }

  // Search mode — the app-wide standard (same as ActionPanel): `?` activates it
  // (hint visible immediately), typing filters live, `esc` clears the query and
  // exits, `enter` confirms keeping the query. The hint shows while the mode is
  // active OR a query remains.
  const clearHint = document.getElementById("clearHint");
  let searching = false;

  function updateHint(q) { clearHint.hidden = !(searching || q); }

  function enterSearch() {
    searching = true;
    updateHint(input.value.trim().toLowerCase());
    input.focus();
  }

  function exitSearchClearing() {
    searching = false;
    input.value = "";
    filter("");
    input.blur();
  }

  window.addEventListener("keydown", (e) => {
    const typing = document.activeElement === input;
    if (!typing) {
      if (e.key === "?" || e.key === "/") { e.preventDefault(); return enterSearch(); }
      if (e.key === "Escape" && input.value) { input.value = ""; filter(""); return; }
      if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
      if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
      return;
    }
    if (e.key === "Enter") {
      searching = false;
      updateHint(input.value.trim().toLowerCase());
      input.blur();
    }
    if (e.key === "Escape") exitSearchClearing();
  });
  input.addEventListener("input", () => filter(input.value));

  render();
</script>
</body>
</html>
